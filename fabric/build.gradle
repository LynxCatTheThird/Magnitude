plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}
base { archivesName = 'magnitude-fabric' }
loom {
    splitEnvironmentSourceSets()
    mods {
        magnitude {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
    runs {
        server { runDir rootProject.file('.local/run/server').absolutePath }
        client { runDir rootProject.file('.local/run/client').absolutePath }
    }
}
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    api project(':core')
    include project(':core')
}
java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'magnitude_test'
        enableGameTests = true
        enableClientGameTests = true
    }
}
loom {
    runs {
        clientGameTest {
            vmArg '-Xmx1400M'
            vmArg '-XX:ActiveProcessorCount=2'
        }
        gameTest {
            vmArg '-Xmx768M'
            vmArg '-XX:ActiveProcessorCount=2'
            vmArg "-Dfabric-api.gametest.report-file=${layout.buildDirectory.file('test-results/gametest.xml').get().asFile.absolutePath}"
        }
    }
}

// Isolated verification fixture; never included in the production mod jar.
tasks.register('gameTestJar', Jar) {
    dependsOn tasks.named('gametestClasses')
    archiveClassifier = 'gametest'
    from sourceSets.gametest.output
}
tasks.register('writeVerificationClasspath') {
    dependsOn tasks.named('gameTestJar'), tasks.named('jar')
    def output = layout.buildDirectory.file('verification/runtime-classpath.json')
    outputs.file(output)
    doLast {
        def file = output.get().asFile
        file.parentFile.mkdirs()
        file.text = groovy.json.JsonOutput.toJson(sourceSets.gametest.runtimeClasspath.files.collect { it.absolutePath })
    }
}
