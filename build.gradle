plugins {
    id 'dev.architectury.loom-no-remap' version '1.17.493'
}
group = 'dev.magnitude'
version = '0.1.4-alpha5+26.3'
base { archivesName = 'magnitude' }
repositories { maven { url = 'https://maven.fabricmc.net/' }; mavenCentral() }
dependencies {
    minecraft 'net.minecraft:minecraft:26.3'
    implementation 'net.fabricmc:fabric-loader:0.19.5'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.160.7+26.3'
    implementation files('libs/pehkui-rebuilt-fabric-3.8.7+26.3.jar')
}
java { sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25; withSourcesJar() }
tasks.withType(JavaCompile).configureEach { options.release = 25; options.encoding = 'UTF-8' }
sourceSets.main.java.srcDir 'src/client/java'
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand version: project.version } }
jar { from('libs') { into 'META-INF/jars' }; from('LICENSE'); from('COPYRIGHT'); preserveFileTimestamps = false; reproducibleFileOrder = true }

// Verification is a separate mod and is never packaged in the production jar.
sourceSets {
    verification {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
loom {
    mods {
        magnitude { sourceSet sourceSets.main }
        'magnitude-verification' { sourceSet sourceSets.verification }
    }
    runs {
        verificationServer {
            server()
            source sourceSets.verification
            name 'Magnitude verification server'
            runDir '.local/verification'
        }
    }
}
tasks.register('ruleTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.magnitude.RuleTests'
}
test {
    failOnNoDiscoveredTests = false
}
tasks.named('runVerificationServer') {
    timeout = java.time.Duration.ofMinutes(2)
    systemProperty 'magnitude.verification.fail', providers.gradleProperty('verificationFailure').getOrElse('false')
    doFirst {
        def directory = file('.local/verification')
        directory.mkdirs()
        file('.local/verification/results.json').delete()
        file('.local/verification/eula.txt').text = 'eula=true\n'
        file('.local/verification/server.properties').text = '''server-ip=127.0.0.1
server-port=0
online-mode=false
level-name=test-world
view-distance=2
simulation-distance=2
spawn-protection=0
pause-when-empty-seconds=0
max-tick-time=60000
'''
    }
    doLast {
        def result = file('.local/verification/results.json')
        if (!result.exists()) throw new GradleException('Verification server exited without a test result')
        def report = new groovy.json.JsonSlurper().parse(result)
        if (report.success != true) throw new GradleException("Runtime verification failed: ${report.failure}")
    }
}
check.dependsOn ruleTest, tasks.named('runVerificationServer')
